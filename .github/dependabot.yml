version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    allow:
      - dependency-name: vite
    commit-message:
      prefix: chore(deps)
      include: scope
